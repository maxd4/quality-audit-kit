name: Fixture checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate-examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check synthetic contracts
        run: python3 tools/validate_examples.py
      - name: Check CLI syntax
        run: npm run check
      - name: Run CLI tests
        run: npm test
